# CI for Royale game of ur: runs exactly the checks listed in AGENTS.md.
# Protected file: changes need the owner's approval.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: "Install dependencies"
        run: "pnpm install --frozen-lockfile"
      - name: "Audit dependencies"
        run: "pnpm audit --audit-level high"
      - name: "Lint"
        run: "pnpm lint"
      - name: "Typecheck"
        run: "pnpm typecheck"
      - name: "Unit tests"
        run: "pnpm test"
      - name: "Build"
        run: "pnpm build"
